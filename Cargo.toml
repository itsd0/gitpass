[package]
name = "gitpass"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Clean-room GitHub-backed zero-knowledge password manager (format v2)"
license = "MIT"

[dependencies]
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "5"
blake3 = "1.8.7"
fs2 = "0.4.3"
tempfile = "3"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
tempfile = "3"
