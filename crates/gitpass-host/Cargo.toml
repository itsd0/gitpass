[package]
name = "gitpass-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gitpass native messaging host for the browser extension"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gitpass-host"
path = "src/main.rs"

[dependencies]
gitpass-core = { path = "../gitpass-core", version = "0.6.5" }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
url = "2"
psl = "2"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
tempfile = "3"
