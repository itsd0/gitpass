name: CI
# Runs on GitHub-hosted runners only (ubuntu-latest / ubuntu-24.04 for Rust/frontend/extension/supply chain/Android,
# macos-latest for the Tauri desktop crate). No self-hosted runners are used
# anywhere (fork PRs get no secrets: release.yml has no PR trigger).
# Isolation: test steps run with HOME pointed at a fresh temp dir, so tests can never touch a real
# ~/.gitpass or ~/.gitconfig even if this file is later run somewhere else.
#
# Required status check for branch protection: "ci-ok". It always runs (also on docs-only PRs) and
# passes when every code job either succeeded (if applicable) or was cleanly skipped (if non-applicable).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      rust: ${{ steps.f.outputs.rust }}
      desktop: ${{ steps.f.outputs.desktop }}
      frontend: ${{ steps.f.outputs.frontend }}
      supply_chain: ${{ steps.f.outputs.supply_chain }}
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        name: detect changed areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          chmod +x scripts/ci-detect-changes.sh
          scripts/ci-detect-changes.sh | tee -a "$GITHUB_OUTPUT"

  rust-test:
    name: rust (test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main pushes write the cache, so PRs (incl. forks) and merge-queue runs cannot poison it.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: isolated HOME
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          T="$RUNNER_TEMP/home"; rm -rf "$T"; mkdir -p "$T"
          echo "TEST_HOME=$T" >> "$GITHUB_ENV"
      - name: cargo nextest
        run: |
          export HOME="$TEST_HOME"
          git config --global user.name "gitpass ci"
          git config --global user.email "ci@gitpass.invalid"
          cargo nextest run --workspace --locked --profile ci
      - name: doctests
        run: |
          export HOME="$TEST_HOME"
          cargo test --workspace --locked --doc

  rust-clippy:
    name: rust (clippy + machete)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: cargo clippy (gating, -D warnings)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-machete
      - name: cargo machete (unused dependencies)
        run: cargo machete

  frontend:
    name: desktop UI + extension
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: isolated HOME
        run: T="$RUNNER_TEMP/home"; mkdir -p "$T"; echo "TEST_HOME=$T" >> "$GITHUB_ENV"
      - name: Tauri npm/Rust version alignment
        run: node scripts/check-tauri-versions.mjs
      - name: desktop UI tests + build
        working-directory: apps/desktop
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run build
      - name: extension tests
        working-directory: extension
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run check

  tauri-macos:
    name: desktop app crate (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: frontend dist (needed by tauri build script)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: cargo check + clippy (gating)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings

  supply-chain:
    name: supply chain (cargo deny + cargo audit)
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny check
        run: cargo deny --locked check
      - name: cargo audit (workspace, gating)
        # Same ignores as deny.toml (reasons there), plus RUSTSEC-2023-0071 (rsa): it is only a stale
        # Cargo.lock entry (ssh-key's optional rsa feature is off; `cargo tree -i rsa --target all` is
        # empty), so it is never compiled. cargo deny walks the real graph and does not flag it.
        run: |
          cargo audit --file Cargo.lock \
            --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071
      - name: cargo audit (desktop app lock)
        # Same unreachable/transitive ignores as the root workspace: RUSTSEC-2026-0387 (crypto-bigint via ssh-key 0.6)
        # and RUSTSEC-2023-0071 (rsa stale entry in lockfile).
        run: |
          cargo audit --file apps/desktop/src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071

  android:
    name: android (build + 16kb runtime)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@8a000e37d04231e10e304b7db3c9fc5455e37863 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-ndk@4.1.2
      - name: isolated HOME and toolchain setup
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          T="$RUNNER_TEMP/home"; rm -rf "$T"; mkdir -p "$T"
          echo "TEST_HOME=$T" >> "$GITHUB_ENV"
          if [ ! -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
            echo "Installing NDK 27.1.12297006..."
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Build native libraries & regenerate UniFFI bindings
        run: |
          export HOME="$TEST_HOME"
          if [ ! -f "android/scripts/build-rust.sh" ]; then
            echo "::error::android/scripts/build-rust.sh not found. Ensure Android companion sources are present."
            exit 1
          fi
          chmod +x android/scripts/build-rust.sh
          ./android/scripts/build-rust.sh
      - name: Verify UniFFI Kotlin bindings file-set
        run: |
          EXPECTED_BINDING="android/app/src/main/java/app/gitpass/core/gitpass_ios_ffi.kt"
          test -f "$EXPECTED_BINDING" || { echo "::error::Expected UniFFI Kotlin binding $EXPECTED_BINDING is missing!"; exit 1; }
          if [ -d "android/app/src/main/java/uniffi" ]; then
            echo "::error::Stale uniffi/ directory detected in android/app/src/main/java!"
            exit 1
          fi
          FOUND_BINDINGS=$(find android/app/src/main/java -name "*gitpass*ffi*.kt")
          COUNT=$(echo "$FOUND_BINDINGS" | grep -c -v '^$' || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Duplicate or stale UniFFI bindings detected (found $COUNT, expected 1):"
            echo "$FOUND_BINDINGS"
            exit 1
          fi
          DIFF=$(git status --porcelain android/app/src/main/java)
          if [ -n "$DIFF" ]; then
            echo "::error::Generated Kotlin bindings drift detected. Commit updated generated files."
            echo "$DIFF"
            git diff android/app/src/main/java
            exit 1
          fi
      - name: Assemble debug APK, lint & unit checks
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Inspect packaged APK, required ABIs & ELF alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::Debug APK not found at $APK"; exit 1; }
          REQUIRED_LIBS=(
            "lib/arm64-v8a/libgitpass_ios_ffi.so"
            "lib/arm64-v8a/libjnidispatch.so"
            "lib/x86_64/libgitpass_ios_ffi.so"
            "lib/x86_64/libjnidispatch.so"
          )
          for lib in "${REQUIRED_LIBS[@]}"; do
            if ! unzip -l "$APK" | grep -q "$lib"; then
              echo "::error::Required native library $lib is missing from APK!"
              exit 1
            fi
            echo "Verified APK contains: $lib"
          done
          EXTRACT_DIR="$(mktemp -d)"
          unzip -q "$APK" "lib/*/*.so" -d "$EXTRACT_DIR"
          for so in "$EXTRACT_DIR"/lib/*/*.so; do
            echo "Inspecting ELF alignment: $so"
            readelf -lW "$so" | awk -v file="$so" '
              $1 == "LOAD" {
                align = strtonum($NF)
                if (align < 16384) {
                  printf "::error file=%s::LOAD segment alignment %d is less than required 16384 (16 KB)\n", file, align
                  err = 1
                }
              }
              END { if (err) exit 1 }
            '
          done
          rm -rf "$EXTRACT_DIR"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Configure KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || { echo "::error::/dev/kvm not found or accessible"; exit 1; }
      - name: Launch API 35 16-KB emulator & run instrumented smoke tests
        run: |
          echo "Installing system-images;android-35;google_apis_ps16k;x86_64..."
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-35;google_apis_ps16k;x86_64"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name "test_api35_16k" \
            --package "system-images;android-35;google_apis_ps16k;x86_64" \
            --device "pixel_8" \
            --force
          "$ANDROID_HOME/emulator/emulator" \
            -avd test_api35_16k \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -timezone UTC \
            -no-snapshot \
            &
          EMU_PID=$!
          echo "EMU_PID=$EMU_PID" >> "$GITHUB_ENV"

          echo "Waiting for emulator boot (bounded timeout 300s)..."
          adb wait-for-device
          boot_completed=0
          for _ in $(seq 1 300); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_completed=1
              break
            fi
            sleep 1
          done

          if [ "$boot_completed" -ne 1 ]; then
            echo "::error::Emulator boot timed out after 300 seconds."
            adb logcat -d > logcat-boot-timeout.txt || true
            exit 1
          fi

          echo "=== Device & Runtime Diagnostics ==="
          echo "Release:   $(adb shell getprop ro.build.version.release | tr -d '\r')"
          echo "SDK:       $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "ABI:       $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "Model:     $(adb shell getprop ro.product.model | tr -d '\r')"
          echo "Kernel:    $(adb shell uname -a | tr -d '\r')"
          PAGE_SIZE=$(adb shell getconf PAGE_SIZE | tr -d '\r')
          echo "PAGE_SIZE: $PAGE_SIZE"

          if [ "$PAGE_SIZE" != "16384" ]; then
            echo "::error::Emulator did not boot with 16-KB pages! Expected 16384, got $PAGE_SIZE"
            exit 1
          fi
          echo "Verified: Accelerated x86_64 emulator running on true 16-KB page size kernel."
          echo "Coverage notice: This validates x86_64 emulated 16-KB behavior; physical ARM64 runtime execution remains unverified in hosted CI."

          cd android
          ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Stop emulator
        if: always()
        run: |
          if [ -n "${EMU_PID:-}" ]; then
            echo "Stopping emulator (PID $EMU_PID)..."
            adb emu kill 2>/dev/null || kill -9 "$EMU_PID" 2>/dev/null || true
          fi
      - name: Upload Android artifacts & test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: gitpass-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/androidTests/connected/
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, rust-test, rust-clippy, frontend, tauri-macos, supply-chain, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: evaluate applicability-aware status gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_NEEDED: ${{ needs.changes.outputs.rust }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          FRONTEND_NEEDED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DESKTOP_NEEDED: ${{ needs.changes.outputs.desktop }}
          TAURI_MACOS_RESULT: ${{ needs.tauri-macos.result }}
          SUPPLY_CHAIN_NEEDED: ${{ needs.changes.outputs.supply_chain }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          ANDROID_NEEDED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          chmod +x scripts/ci-ok-gate.sh
          scripts/ci-ok-gate.sh
