[package]
name = "gitpass-mobile-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI bindings exposing gitpass-core to the iOS and Android companion apps. No crypto is re-implemented here; every secret operation runs in gitpass-core."

[lib]
name = "gitpass_mobile_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
gitpass-core = { version = "0.7.0", path = "../gitpass-core" }
uniffi = { version = "0.29", features = ["build", "cli"] }
anyhow = "1"
serde_json = "1"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
gitpass-core = { version = "0.7.0", path = "../gitpass-core", features = ["test-fixtures"] }
