name: CI
# Runs on the self-hosted Mac (repo-level runner, private repo only). Hosted Windows/Linux/macOS
# matrices were dropped from per-push CI to save Actions minutes; release.yml can still build them.
# Isolation: every test step runs with HOME pointed at a fresh temp dir, so nothing can read or write
# the user's real ~/.gitpass, ~/.gitconfig or the running app's agent socket (~/Library/Application Support/gitpass).
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".github/workflows/ios.yml", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  mac:
    name: rust + frontend (self-hosted Mac)
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: isolated HOME
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          T="$RUNNER_TEMP/home"; rm -rf "$T"; mkdir -p "$T"
          echo "TEST_HOME=$T" >> "$GITHUB_ENV"
      - name: cargo test
        run: |
          export HOME="$TEST_HOME"
          git config --global user.name "gitpass ci"
          git config --global user.email "ci@gitpass.invalid"
          cargo test --workspace --locked
      - name: cargo clippy (report only)
        run: cargo clippy --workspace --locked --all-targets || echo "::warning::clippy reported issues"
      - name: desktop UI tests + build
        working-directory: apps/desktop
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run build
      - name: desktop app cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: extension tests
        working-directory: extension
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run check
