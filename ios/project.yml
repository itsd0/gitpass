# gitpass for iOS — XcodeGen project.
#
# The project is generated, never committed, so signing stays local:
#   cd ios && ./scripts/build-xcframework.sh && xcodegen generate
# then open Gitpass.xcodeproj, pick your personal team in Signing &
# Capabilities, and run on your iPhone. CI does the same steps with
# CODE_SIGNING_ALLOWED=NO and uploads the unsigned .app as an artifact.
#
# No DEVELOPMENT_TEAM is committed here on purpose. The bundle IDs
# below are the ones the app uses; a free personal team works for
# local installs (AutoFill and app groups need a team, which Xcode
# supplies from your Apple ID when you pick it locally).
name: Gitpass
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: dev.gitpass.ios
  createIntermediateGroups: true
targets:
  GitpassApp:
    type: application
    platform: iOS
    sources:
      - Sources/GitpassApp
      - Generated/gitpass_ios_ffi.swift
    info:
      path: Sources/GitpassApp/Info.plist
    entitlements:
      path: Sources/GitpassApp/GitpassApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gitpass.ios
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: Frameworks/GitpassCore.xcframework
        embed: true
  GitpassAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - Sources/AutoFill
      - Generated/gitpass_ios_ffi.swift
    info:
      path: Sources/AutoFill/Info.plist
    entitlements:
      path: Sources/AutoFill/GitpassAutoFill.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gitpass.ios.autofill
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: Frameworks/GitpassCore.xcframework
        embed: false
  GitpassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Generated/gitpass_ios_ffi.swift
      # Keychain + Sync are compiled into the test bundle directly so
      # the tests do not need to import the app target as a library.
      - path: Sources/GitpassApp/Keychain.swift
      - path: Sources/GitpassApp/SyncService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gitpass.ios.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: GitpassApp
      - framework: Frameworks/GitpassCore.xcframework
        embed: false
schemes:
  Gitpass:
    build:
      targets:
        GitpassApp: all
        GitpassAutoFill: all
    test:
      targets:
        - GitpassTests
    run:
      config: Debug
