<!doctype html><html><head><meta charset="utf-8"><title>gitpass test: sign up</title></head><body>
<h1>Create your account</h1>
<form id="signup" action="/register" method="post">
  <input name="first_name" placeholder="First name">
  <input name="username" placeholder="Choose a username">
  <input name="email" type="email" placeholder="Email">
  <input id="np" name="password" type="password" placeholder="Create password">
  <input id="cp" name="password_confirmation" type="password" placeholder="Confirm password">
  <button type="submit">Sign up</button>
</form>
<form id="change" action="/settings/password" method="post">
  <h2>Change password</h2>
  <input id="cur" type="password" name="old_password" autocomplete="current-password">
  <input id="new1" type="password" name="new_password" autocomplete="new-password">
  <input id="new2" type="password" name="new_password2" placeholder="Repeat new password">
  <button>Update password</button>
</form>
</body></html>
