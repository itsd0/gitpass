name: Release
# Tag push v* -> draft GitHub Release on the PUBLIC repo itsd0/gitpass-releases with installers + latest.json
# (updater endpoint). Only built artifacts are published there.
# Requires secret RELEASES_REPO_TOKEN: fine-grained PAT, repo itsd0/gitpass-releases only, Contents: read & write.
# workflow_dispatch -> same builds, uploaded as workflow artifacts only (no release).
#
# Self-hosted runner policy: the self-hosted Mac (label gitpass-mac) is used ONLY by this workflow, which has
# no pull_request / pull_request_target trigger, and every self-hosted job is guarded so it runs only in
# itsd0/gitpass (never a fork) and only when the owner itsd0 pushed the v* tag or dispatched the run.
# Cost control: macOS builds run on the self-hosted Mac (label gitpass-mac, free). Windows/Linux use hosted
# runners and only run on a manual dispatch with include_windows_linux=true, so a tag release is macOS-only.
# Signing: macOS bundles are signed with the self-signed keychain identity "gitpass Local Signing" (not
# Developer ID, not notarized). The runner LaunchAgent must run in the logged-in user's session with the
# login keychain unlocked (see docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_windows_linux:
        description: "Also build Windows + Linux on hosted runners (uses Actions minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: desktop (${{ matrix.name }})
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: macos-arm64, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin --bundles app,dmg" }
          - { name: macos-x64, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin --bundles app,dmg" }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
      APPLE_SIGNING_IDENTITY: "gitpass Local Signing"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: preflight (rust target + signing identity reachable)
        run: |
          rustup target add ${{ matrix.target }}
          security find-identity -p codesigning | grep -q "gitpass Local Signing" || { echo "::error::signing identity not visible to the runner (keychain locked or wrong session)"; exit 1; }
          f="$RUNNER_TEMP/signtest"; cp /bin/echo "$f"
          codesign --force -s "gitpass Local Signing" "$f" || { echo "::error::codesign failed: unlock the login keychain on the Mac"; exit 1; }
          rm -f "$f"
      - working-directory: apps/desktop
        run: npm ci
      - name: build + publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        with:
          owner: itsd0
          repo: gitpass-releases
          # Tag is created in gitpass-releases; the source SHA does not exist there.
          releaseCommitish: main
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: gitpass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. macOS builds are signed with a self-signed certificate (not Developer ID, not notarized).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  other-os:
    name: desktop (${{ matrix.name }}, hosted)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && github.event_name == 'workflow_dispatch' && inputs.include_windows_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, args: "--bundles appimage,deb" }
          - { name: windows-x64, os: windows-latest, args: "--bundles msi,nsis" }
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - working-directory: apps/desktop
        run: npm ci
      # Manual dispatch never publishes; artifacts only. To add these to a release, upload them by hand.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe*
          if-no-files-found: error

  cli-host:
    name: cli + native host (macOS arm64)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo build --release --locked -p gitpass-cli -p gitpass-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-cli-host-macos-arm64
          path: |
            target/release/gitpass
            target/release/gitpass-host
