<!doctype html><html><head><meta charset="utf-8"><title>gitpass test: multi-step login</title></head><body>
<h1>Sign in to Example</h1>
<form id="step1" action="/identifier">
  <input id="ident" type="text" name="identifier" autocomplete="username" placeholder="Email or phone">
  <button type="submit">Next</button>
</form>
<form id="step2" action="/challenge" style="display:none">
  <input id="pw" type="password" name="Passwd" autocomplete="current-password">
  <button type="submit">Next</button>
</form>
<form id="step3" action="/2fa" style="display:none">
  <h2>Two-factor authentication</h2>
  <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
  <button type="submit">Verify</button>
</form>
<form id="split" action="/2fa-split" style="display:none">
  <input class="d" maxlength="1" inputmode="numeric"><input class="d" maxlength="1" inputmode="numeric"><input class="d" maxlength="1" inputmode="numeric">
  <input class="d" maxlength="1" inputmode="numeric"><input class="d" maxlength="1" inputmode="numeric"><input class="d" maxlength="1" inputmode="numeric">
</form>
<script>
  // Simulates the real flow; tests toggle the forms directly.
  document.getElementById('step1').addEventListener('submit', (e) => { e.preventDefault(); step1.style.display = 'none'; step2.style.display = ''; });
  document.getElementById('step2').addEventListener('submit', (e) => { e.preventDefault(); step2.style.display = 'none'; step3.style.display = ''; });
</script>
</body></html>
