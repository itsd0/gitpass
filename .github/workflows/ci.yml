name: CI
# Runs on the self-hosted Mac (repo-level runner, private repo only). Hosted Windows/Linux/macOS
# matrices were dropped from per-push CI to save Actions minutes; release.yml can still build them.
# Isolation: every test step runs with HOME pointed at a fresh temp dir, so nothing can read or write
# the user's real ~/.gitpass, ~/.gitconfig or the running app's agent socket (~/Library/Application Support/gitpass).
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".github/workflows/ios.yml", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  mac:
    name: rust + frontend (self-hosted Mac)
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: isolated HOME
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          T="$RUNNER_TEMP/home"; rm -rf "$T"; mkdir -p "$T"
          echo "TEST_HOME=$T" >> "$GITHUB_ENV"
      - name: cargo test
        run: |
          export HOME="$TEST_HOME"
          git config --global user.name "gitpass ci"
          git config --global user.email "ci@gitpass.invalid"
          cargo test --workspace --locked
      - name: cargo clippy (report only)
        run: cargo clippy --workspace --locked --all-targets || echo "::warning::clippy reported issues"
      - name: desktop UI tests + build
        working-directory: apps/desktop
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run build
      - name: desktop app cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: extension tests
        working-directory: extension
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run check

  supply-chain:
    name: supply chain (cargo deny + cargo audit)
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: tools present
        run: |
          command -v cargo-deny && command -v cargo-audit || { echo "::error::install on the runner Mac: cargo install --locked cargo-deny cargo-audit"; exit 1; }
      - name: cargo deny check
        run: cargo deny --locked check
      - name: cargo audit (workspace, gating)
        # Same ignores as deny.toml (reasons there), plus RUSTSEC-2023-0071 (rsa): it is only a stale
        # Cargo.lock entry (ssh-key's optional rsa feature is off; `cargo tree -i rsa --target all` is
        # empty), so it is never compiled. cargo deny walks the real graph and does not flag it.
        run: |
          cargo audit --file Cargo.lock \
            --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071
      - name: cargo audit (desktop app lock, report only)
        # Tauri-transitive findings (quick-xml via plist, time via cookie, unic-*/glib warnings) need
        # upstream bumps / a newer MSRV; reported, not gating, until those land.
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock || echo "::warning::cargo audit found advisories in apps/desktop/src-tauri/Cargo.lock"
