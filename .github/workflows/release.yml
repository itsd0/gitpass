name: Release
# Tag push v* -> GitHub Release on itsd0/gitpass (this repo) with installers + updater artifacts + latest.json,
# published as Latest by the `publish` job once both macOS builds succeed (#292).
# Releases are no longer mirrored to itsd0/gitpass-releases; apps older than 0.6.7 must update manually.
# workflow_dispatch -> DRY RUN: same builds incl. updater signing (.sig), uploaded as workflow artifacts only;
# nothing is published and no tag is created.
#
# Runners: everything runs on GitHub-hosted runners. macOS arm64 and x64 both build on macos-14 (Apple
# Silicon); x64 is cross-compiled with --target x86_64-apple-darwin, as on the former release Mac.
# Every job is guarded so it runs only in itsd0/gitpass (never a fork) and only when the owner itsd0 pushed the
# v* tag or dispatched the run; there is no pull_request trigger, so fork PRs never see these secrets.
# Desktop builds (tag and dry run) and publishing run in the `release` environment (deployment rules: v* tags
# and the main branch, so a dry run must be dispatched on main).
# Windows/Linux only run on a manual dispatch with include_windows_linux=true, so a tag release is macOS-only.
# macOS code signing: with secrets APPLE_CERTIFICATE (base64 .p12 of the self-signed "gitpass Local Signing"
# identity) + APPLE_CERTIFICATE_PASSWORD, the bundle is signed with that identity (not Developer ID, not
# notarized). Without them a dry run is ad-hoc signed ("-"), and a tag release FAILS rather than silently
# changing the app's signing identity (see docs/RELEASE.md).
# Android (#479): the `android` job builds a release APK + AAB signed with the owner's upload keystore (secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; missing secrets fail
# the job, also on a dry run). On a tag, `publish` attaches them to the release; a dry run keeps them as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_windows_linux:
        description: "Also build Windows + Linux on hosted runners (uses Actions minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: desktop (${{ matrix.name }})
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: ${{ matrix.os }}
    # Always in `release` so dry runs on main also get the APPLE_CERTIFICATE env secrets (deployment rules:
    # v* tags and the main branch). Publishing stays tag-only (`publish` job `if`).
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write  # tauri-action creates/updates the draft release on this repo
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin --bundles app,dmg" }
          - { name: macos-x64, os: macos-14, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin --bundles app,dmg" }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - name: preflight (updater key + macOS signing identity)
        # The certificate env vars are only exported when set: Tauri tries to import APPLE_CERTIFICATE
        # whenever the variable exists, even if empty.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          if [ -n "$CERT" ]; then
            # Import the self-signed identity ourselves (not via Tauri's APPLE_CERTIFICATE import): Tauri resolves
            # identities with `find-identity -v`, which skips an untrusted self-signed cert. So trust it for code
            # signing on this ephemeral runner, then hand Tauri only the identity name.
            KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"; echo "::add-mask::$KCPW"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            printf %s "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            existing=()
            while IFS= read -r k; do existing+=("$(echo "$k" | tr -d '"' | xargs)"); done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KC" "${existing[@]}"
            security find-certificate -c "gitpass Local Signing" -p "$KC" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            rm -f "$RUNNER_TEMP/cert.pem"
            security find-identity -v -p codesigning "$KC" | grep -q "gitpass Local Signing" \
              || { echo "::error::'gitpass Local Signing' is not a valid code-signing identity after import"; exit 1; }
            echo "APPLE_SIGNING_IDENTITY=gitpass Local Signing" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD are not set; refusing to ship a release with a different signing identity (see docs/RELEASE.md)"
            exit 1
          else
            echo "::warning::dry run without APPLE_CERTIFICATE: the app is ad-hoc signed"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - working-directory: apps/desktop
        run: npm ci
      - name: build + publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: gitpass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. macOS builds are signed with a self-signed certificate (not Developer ID, not notarized).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: build only (dry run, manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - name: check bundles and updater signature
        run: |
          b="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -l "$b"/dmg/*.dmg "$b"/macos/*.app.tar.gz "$b"/macos/*.app.tar.gz.sig
          for f in "$b"/macos/*.app.tar.gz.sig; do [ -s "$f" ] || { echo "::error::empty $f"; exit 1; }; done
          codesign -dv "$b"/macos/*.app 2>&1 | grep -E "Identifier|Signature|Authority|TeamIdentifier" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  android:
    name: android (signed release)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: ubuntu-24.04
    # `release` environment: same deployment rules as the desktop builds (v* tags and main).
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: preflight (Android signing secrets)
        # Fail before the long build. Only the names of missing secrets are printed, never values.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KS_B64" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KS_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Android signing secrets are not set: ${missing[*]} (see docs/RELEASE.md, 'Android release signing')"
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      # No rust-cache in release builds: nothing restored from a cache ends up in a signed artifact.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: "1.90.0"  # = RUST_TOOLCHAIN in ci.yml and android/scripts/build-rust.sh
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-ndk@4.1.2
      - name: Android NDK
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: build native libraries + UniFFI bindings
        run: |
          ./android/scripts/build-rust.sh
          if [ -n "$(git status --porcelain android/app/src/main/java)" ]; then
            echo "::error::generated UniFFI Kotlin bindings differ from the committed ones"
            exit 1
          fi
      - name: decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/gitpass-upload.jks"
          ( umask 077; printf %s "$KS_B64" | base64 --decode > "$KS" ) \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          keytool -list -keystore "$KS" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::the keystore cannot be opened with ANDROID_KEYSTORE_PASSWORD or has no entry ANDROID_KEY_ALIAS"; exit 1; }
          echo "GITPASS_ANDROID_KEYSTORE=$KS" >> "$GITHUB_ENV"
      - name: build signed release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
      - name: delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/gitpass-upload.jks"
      - name: verify signatures, alignment, version + checksums
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB" || { echo "::error::release APK or AAB missing"; exit 1; }
          # APK: v2 + v3 signatures, 4-byte zipalign with 16 KB page alignment for uncompressed .so files.
          out="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          grep -E "^Verified using|^Signer #1 certificate (DN|SHA-256)" <<<"$out"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" <<<"$out" || { echo "::error::APK is not v2-signed"; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$out" || { echo "::error::APK is not v3-signed"; exit 1; }
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK" || { echo "::error::APK is not zipaligned (-P 16)"; exit 1; }
          # (no -strict: a self-signed upload certificate is expected and would fail it)
          grep -q "^jar verified" <<<"$(jarsigner -verify "$AAB")" || { echo "::error::AAB is not signed"; exit 1; }
          # Version: the APK carries the workspace version; on a tag it must match the tag.
          badging="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          grep "^package:" <<<"$badging"
          vn="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
          [ -n "$vn" ] || { echo "::error::cannot read versionName from the APK"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$vn" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::APK versionName $vn does not match tag $GITHUB_REF_NAME (bump the workspace version in Cargo.toml)"
            exit 1
          fi
          # Native libraries: required ABIs present, 16 KB ELF segment alignment kept.
          listing="$(unzip -l "$APK")"
          for lib in lib/arm64-v8a/libgitpass_mobile_ffi.so lib/x86_64/libgitpass_mobile_ffi.so \
                     lib/arm64-v8a/libjnidispatch.so lib/x86_64/libjnidispatch.so; do
            grep -qF "$lib" <<<"$listing" || { echo "::error::$lib is missing from the APK"; exit 1; }
          done
          X="$(mktemp -d)"; unzip -q "$APK" "lib/*/*.so" -d "$X"
          python3 - "$X" <<'EOF'
          import glob, subprocess, sys
          for so in glob.glob(sys.argv[1] + '/lib/*/*.so'):
              for line in subprocess.check_output(['readelf', '-lW', so], text=True).splitlines():
                  p = line.split()
                  if p and p[0] in ('LOAD', 'GNU_RELRO'):
                      off, vaddr = int(p[1], 16), int(p[2], 16)
                      if p[0] == 'LOAD' and int(p[-1], 16) < 16384:
                          sys.exit(f'::error::{so}: LOAD alignment < 16 KB')
                      if off % 16384 != vaddr % 16384:
                          sys.exit(f'::error::{so}: {p[0]} offset/vaddr not congruent mod 16 KB')
          print('native libraries: 16 KB aligned')
          EOF
          rm -rf "$X"
          mkdir dist-android
          cp "$APK" "dist-android/gitpass-android-$vn.apk"
          cp "$AAB" "dist-android/gitpass-android-$vn.aab"
          (cd dist-android && sha256sum "gitpass-android-$vn.apk" "gitpass-android-$vn.aab" | tee "gitpass-android-$vn.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-android-release
          path: dist-android/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [macos, android]
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - name: download and check assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" -R itsd0/gitpass
          v="${TAG#v}"
          for f in "gitpass_${v}_aarch64.dmg" "gitpass_${v}_x64.dmg" gitpass_aarch64.app.tar.gz gitpass_aarch64.app.tar.gz.sig \
                   gitpass_x64.app.tar.gz gitpass_x64.app.tar.gz.sig latest.json; do
            [ -s "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          jq -e --arg v "$v" '.version == $v and (.platforms | has("darwin-aarch64") and has("darwin-x86_64"))' latest.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gitpass-android-release
          path: dist-android
      - name: attach Android APK + AAB on itsd0/gitpass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          cd dist-android
          for f in "gitpass-android-$v.apk" "gitpass-android-$v.aab" "gitpass-android-$v.sha256"; do
            [ -s "$f" ] || { echo "::error::missing Android artifact $f"; exit 1; }
          done
          sha256sum -c "gitpass-android-$v.sha256"
          gh release upload "$TAG" -R itsd0/gitpass --clobber \
            "gitpass-android-$v.apk" "gitpass-android-$v.aab" "gitpass-android-$v.sha256"
      - name: publish on itsd0/gitpass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" -R itsd0/gitpass --draft=false --prerelease
          else
            gh release edit "$TAG" -R itsd0/gitpass --draft=false --prerelease=false --latest
          fi

  other-os:
    name: desktop (${{ matrix.name }}, hosted)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && github.event_name == 'workflow_dispatch' && inputs.include_windows_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, args: "--bundles appimage,deb" }
          - { name: windows-x64, os: windows-latest, args: "--bundles msi,nsis" }
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - working-directory: apps/desktop
        run: npm ci
      # Manual dispatch never publishes; artifacts only. To add these to a release, upload them by hand.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe*
          if-no-files-found: error

  cli-host:
    name: cli + native host (macOS arm64)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --locked -p gitpass-cli -p gitpass-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-cli-host-macos-arm64
          path: |
            target/release/gitpass
            target/release/gitpass-host
