name: Release
# Tag push v* -> GitHub Release on itsd0/gitpass (this repo) with installers + updater artifacts + latest.json,
# published as Latest by the `publish` job once both macOS builds succeed (#292).
# Releases are no longer mirrored to itsd0/gitpass-releases; apps older than 0.6.7 must update manually.
# workflow_dispatch -> DRY RUN: same builds incl. updater signing (.sig), uploaded as workflow artifacts only;
# nothing is published and no tag is created.
#
# Runners: everything runs on GitHub-hosted runners. macOS arm64 and x64 both build on macos-14 (Apple
# Silicon); x64 is cross-compiled with --target x86_64-apple-darwin, as on the former release Mac.
# Every job is guarded so it runs only in itsd0/gitpass (never a fork) and only when the owner itsd0 pushed the
# v* tag or dispatched the run; there is no pull_request trigger, so fork PRs never see these secrets.
# Desktop builds (tag and dry run) and publishing run in the `release` environment (deployment rules: v* tags
# and the main branch, so a dry run must be dispatched on main).
# Windows/Linux only run on a manual dispatch with include_windows_linux=true, so a tag release is macOS-only.
# macOS code signing: with secrets APPLE_CERTIFICATE (base64 .p12 of the self-signed "gitpass Local Signing"
# identity) + APPLE_CERTIFICATE_PASSWORD, the bundle is signed with that identity (not Developer ID, not
# notarized). Without them a dry run is ad-hoc signed ("-"), and a tag release FAILS rather than silently
# changing the app's signing identity (see docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_windows_linux:
        description: "Also build Windows + Linux on hosted runners (uses Actions minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: desktop (${{ matrix.name }})
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: ${{ matrix.os }}
    # Always in `release` so dry runs on main also get the APPLE_CERTIFICATE env secrets (deployment rules:
    # v* tags and the main branch). Publishing stays tag-only (`publish` job `if`).
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write  # tauri-action creates/updates the draft release on this repo
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin --bundles app,dmg" }
          - { name: macos-x64, os: macos-14, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin --bundles app,dmg" }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - name: preflight (updater key + macOS signing identity)
        # The certificate env vars are only exported when set: Tauri tries to import APPLE_CERTIFICATE
        # whenever the variable exists, even if empty.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          if [ -n "$CERT" ]; then
            # Import the self-signed identity ourselves (not via Tauri's APPLE_CERTIFICATE import): Tauri resolves
            # identities with `find-identity -v`, which skips an untrusted self-signed cert. So trust it for code
            # signing on this ephemeral runner, then hand Tauri only the identity name.
            KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"; echo "::add-mask::$KCPW"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            printf %s "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            existing=()
            while IFS= read -r k; do existing+=("$(echo "$k" | tr -d '"' | xargs)"); done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KC" "${existing[@]}"
            security find-certificate -c "gitpass Local Signing" -p "$KC" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            rm -f "$RUNNER_TEMP/cert.pem"
            security find-identity -v -p codesigning "$KC" | grep -q "gitpass Local Signing" \
              || { echo "::error::'gitpass Local Signing' is not a valid code-signing identity after import"; exit 1; }
            echo "APPLE_SIGNING_IDENTITY=gitpass Local Signing" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD are not set; refusing to ship a release with a different signing identity (see docs/RELEASE.md)"
            exit 1
          else
            echo "::warning::dry run without APPLE_CERTIFICATE: the app is ad-hoc signed"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - working-directory: apps/desktop
        run: npm ci
      - name: build + publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: gitpass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. macOS builds are signed with a self-signed certificate (not Developer ID, not notarized).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: build only (dry run, manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - name: check bundles and updater signature
        run: |
          b="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -l "$b"/dmg/*.dmg "$b"/macos/*.app.tar.gz "$b"/macos/*.app.tar.gz.sig
          for f in "$b"/macos/*.app.tar.gz.sig; do [ -s "$f" ] || { echo "::error::empty $f"; exit 1; }; done
          codesign -dv "$b"/macos/*.app 2>&1 | grep -E "Identifier|Signature|Authority|TeamIdentifier" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  publish:
    name: publish release
    needs: macos
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - name: download and check assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" -R itsd0/gitpass
          v="${TAG#v}"
          for f in "gitpass_${v}_aarch64.dmg" "gitpass_${v}_x64.dmg" gitpass_aarch64.app.tar.gz gitpass_aarch64.app.tar.gz.sig \
                   gitpass_x64.app.tar.gz gitpass_x64.app.tar.gz.sig latest.json; do
            [ -s "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          jq -e --arg v "$v" '.version == $v and (.platforms | has("darwin-aarch64") and has("darwin-x86_64"))' latest.json
      - name: publish on itsd0/gitpass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" -R itsd0/gitpass --draft=false --prerelease
          else
            gh release edit "$TAG" -R itsd0/gitpass --draft=false --prerelease=false --latest
          fi

  other-os:
    name: desktop (${{ matrix.name }}, hosted)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && github.event_name == 'workflow_dispatch' && inputs.include_windows_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, args: "--bundles appimage,deb" }
          - { name: windows-x64, os: windows-latest, args: "--bundles msi,nsis" }
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - working-directory: apps/desktop
        run: npm ci
      # Manual dispatch never publishes; artifacts only. To add these to a release, upload them by hand.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe*
          if-no-files-found: error

  cli-host:
    name: cli + native host (macOS arm64)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --locked -p gitpass-cli -p gitpass-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-cli-host-macos-arm64
          path: |
            target/release/gitpass
            target/release/gitpass-host
