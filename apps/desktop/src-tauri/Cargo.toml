[package]
name = "gitpass-desktop"
version = "0.6.8"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "gitpass desktop GUI (Tauri 2)"

# Standalone workspace: kept out of the root workspace so `cargo test --workspace` never needs GTK/WebKit.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
gitpass-gui-core = { path = "../gui-core" }
gitpass-core = { path = "../../../crates/gitpass-core" }
gitpass-pasteboard = { path = "../../../crates/gitpass-pasteboard" }
arboard = { version = "3", default-features = false, features = ["image-data"] }
zeroize = "1"
anyhow = "1"
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSData"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }

[dev-dependencies]
tauri = { version = "2", features = ["test", "tray-icon", "image-png"] }
