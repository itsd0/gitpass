[package]
name = "gitpass-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gitpass core library: crypto, store (format v4: X25519 identity, sharing, rotating device revocation), field merge, devices, sync, TOTP, fuzzy search"

[dependencies]
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "5"
blake3 = "1.8.7"
fs2 = "0.4.3"
tempfile = "3"
hmac = "0.12"
sha1 = "0.10"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
tempfile = "3"
