[package]
name = "gitpass"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Clean-room MVP of a GitHub-backed zero-knowledge password manager"
license = "MIT"

[dependencies]
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
