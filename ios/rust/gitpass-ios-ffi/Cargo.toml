[package]
name = "gitpass-ios-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "UniFFI bindings exposing gitpass-core to the iOS app. No crypto is re-implemented here; every secret operation runs in gitpass-core."

[lib]
name = "gitpass_ios_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
gitpass-core = { version = "0.6.2", path = "../../../crates/gitpass-core" }
uniffi = { version = "0.29", features = ["build", "cli"] }
anyhow = "1"
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
gitpass-core = { version = "0.6.2", path = "../../../crates/gitpass-core" }
