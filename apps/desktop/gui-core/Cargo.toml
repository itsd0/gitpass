[package]
name = "gitpass-gui-core"
version = "0.5.0-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri-free command layer for the gitpass desktop GUI (session state, DTOs, auto-lock)"

[dependencies]
gitpass-core = { path = "../../../crates/gitpass-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
dirs = "5"
serde_json = "1"
rand = "0.8"
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
