[package]
name = "gitpass-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gitpass command-line interface"

[[bin]]
name = "gitpass"
path = "src/main.rs"

[dependencies]
gitpass-core = { path = "../gitpass-core", version = "0.3.0" }
anyhow = "1"
dirs = "5"
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }
arboard = { version = "3.7", default-features = false, optional = true }

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]
