[package]
name = "gitpass-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gitpass command-line interface"

[[bin]]
name = "gitpass"
path = "src/main.rs"

[dependencies]
gitpass-core = { path = "../gitpass-core", version = "0.6.6" }
gitpass-pasteboard = { path = "../gitpass-pasteboard", version = "0.6.6" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
arboard = { version = "3.7", default-features = false, optional = true }

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]

[dev-dependencies]
tempfile = "3"
anyhow = "1"
