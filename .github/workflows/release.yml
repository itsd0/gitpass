name: Release
# Tag push v* -> draft GitHub Release with installers + latest.json (updater).
# workflow_dispatch -> same builds, uploaded as workflow artifacts only (no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin --bundles app,dmg" }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin --bundles app,dmg" }
          - { name: linux-x64, os: ubuntu-22.04, target: "", args: "--bundles appimage,deb" }
          - { name: windows-x64, os: windows-latest, target: "", args: "--bundles msi,nsis" }
    runs-on: ${{ matrix.os }}
    env:
      # Updater artifact signing (minisign). The key has no password.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # macOS: ad-hoc code signature only (no Developer ID, not notarized).
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - working-directory: apps/desktop
        run: npm ci
      - name: build + publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: gitpass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. macOS builds are ad-hoc signed (not notarized).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe*
          if-no-files-found: error

  cli-host:
    name: cli + native host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p gitpass-cli -p gitpass-host
      - uses: actions/upload-artifact@v4
        with:
          name: gitpass-cli-host-${{ matrix.os }}
          path: |
            target/release/gitpass
            target/release/gitpass-host
            target/release/gitpass.exe
            target/release/gitpass-host.exe
