<!doctype html><html><head><meta charset="utf-8"><title>gitpass test: sign up with password rules</title></head><body>
<h1>Create your account</h1>
<form id="signup" action="/register" method="post">
  <input name="username" placeholder="Choose a username">
  <input name="email" type="email" placeholder="Email">
  <input id="np" name="password" type="password" placeholder="Create password" maxlength="16"
         passwordrules="minlength: 12; maxlength: 16; required: lower; required: upper; required: digit; allowed: [-_]">
  <input id="cp" name="password_confirmation" type="password" placeholder="Confirm password">
  <button type="submit">Sign up</button>
</form>
</body></html>
