name: iOS

# GitHub-hosted macos-latest only (no self-hosted runners are used).
# Builds the gitpass iOS app on macOS: the UniFFI XCFramework, the
# Rust FFI tests, and an unsigned simulator build + test run.
# This workflow never signs, never needs a team, and never touches
# any vault repository — it only builds and tests the app itself.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios/**"
      - "crates/gitpass-core/**"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "crates/gitpass-core/**"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.90.0"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ffi:
    name: Rust FFI tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned via env
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: FFI crate tests (real vault, real crypto)
        run: |
          export RUNNER_HOME_CARGO="${CARGO_HOME:-$HOME/.cargo}" RUNNER_HOME_RUSTUP="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$RUNNER_TEMP/home"; rm -rf "$HOME"; mkdir -p "$HOME"
          export CARGO_HOME="$RUNNER_HOME_CARGO" RUSTUP_HOME="$RUNNER_HOME_RUSTUP"
          cargo test -p gitpass-ios-ffi --locked

  ios:
    name: iOS simulator build + test
    runs-on: macos-latest
    needs: rust-ffi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned via env
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build XCFramework + Swift bindings
        run: |
          chmod +x ios/scripts/build-xcframework.sh
          ./ios/scripts/build-xcframework.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for simulator (unsigned)
        working-directory: ios
        run: |
          # No hardcoded device name: the simulator set on a fresh
          # macos runner changes with the Xcode version (iPhone 16
          # was not present and failed the run with exit code 70).
          xcodebuild build \
            -project Gitpass.xcodeproj \
            -scheme Gitpass \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Test on simulator (unsigned)
        working-directory: ios
        run: |
          # Pick whatever iPhone simulator this runner actually has
          # instead of naming one that may not exist.
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $UDID"
          # Ad-hoc signing ("-", no team, no secrets): a fully unsigned
          # bundle has no entitlements, so the simulator keychain
          # rejects it with errSecMissingEntitlement (-34018) and the
          # Keychain tests fail. Ad-hoc signing is simulator-only.
          xcodebuild test \
            -project Gitpass.xcodeproj \
            -scheme Gitpass \
            -destination "id=$UDID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
      - name: Build unsigned archive for inspection
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Gitpass.xcodeproj \
            -scheme Gitpass \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Gitpass.xcarchive" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          ls -la "$RUNNER_TEMP/Gitpass.xcarchive"
      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: gitpass-ios-unsigned
          path: |
            ${{ runner.temp }}/Gitpass.xcarchive
            ios/Frameworks/GitpassCore.xcframework
          if-no-files-found: warn
