name: CI
# Runs on GitHub-hosted runners only (ubuntu-latest for Rust/frontend/extension/supply chain,
# macos-latest for the Tauri desktop crate). The self-hosted Mac is NEVER used for push/PR CI:
# it is reserved for release.yml on v* tags pushed by the owner (fork PRs must not reach it).
# Isolation: test steps run with HOME pointed at a fresh temp dir, so tests can never touch a real
# ~/.gitpass or ~/.gitconfig even if this file is later run somewhere else.
#
# Required status check for branch protection: "ci-ok". It always runs (also on docs-only PRs) and
# passes when every code job either succeeded or was skipped because no code changed.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        name: code changed? (anything other than *.md, docs/, LICENSE); rust changed? (also ignores apps/desktop/src/, extension/)
        # merge_group and workflow_dispatch always run everything.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          code=true; rust=true
          if [ "$EVENT" != workflow_dispatch ] && [ "$EVENT" != merge_group ] && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$HEAD")
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -vqE '(\.md$|^docs/|^LICENSE$)'; then code=false; fi
            if [ -n "$files" ] && ! echo "$files" | grep -vqE '(\.md$|^docs/|^LICENSE$|^apps/desktop/src/|^extension/)'; then rust=false; fi
          fi
          [ "$code" = true ] || rust=false
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"

  rust-test:
    name: rust (test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main pushes write the cache, so PRs (incl. forks) and merge-queue runs cannot poison it.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: isolated HOME
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          T="$RUNNER_TEMP/home"; rm -rf "$T"; mkdir -p "$T"
          echo "TEST_HOME=$T" >> "$GITHUB_ENV"
      - name: cargo nextest
        run: |
          export HOME="$TEST_HOME"
          git config --global user.name "gitpass ci"
          git config --global user.email "ci@gitpass.invalid"
          cargo nextest run --workspace --locked --profile ci
      - name: doctests
        run: |
          export HOME="$TEST_HOME"
          cargo test --workspace --locked --doc

  rust-clippy:
    name: rust (clippy + machete)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: cargo clippy (gating, -D warnings)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-machete
      - name: cargo machete (unused dependencies)
        run: cargo machete

  frontend:
    name: desktop UI + extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: isolated HOME
        run: T="$RUNNER_TEMP/home"; mkdir -p "$T"; echo "TEST_HOME=$T" >> "$GITHUB_ENV"
      - name: Tauri npm/Rust version alignment
        run: node scripts/check-tauri-versions.mjs
      - name: desktop UI tests + build
        working-directory: apps/desktop
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run build
      - name: extension tests
        working-directory: extension
        run: |
          export HOME="$TEST_HOME"
          npm ci
          npm test
          npm run check

  tauri-macos:
    name: desktop app crate (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: frontend dist (needed by tauri build script)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: cargo check + clippy (gating)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings

  supply-chain:
    name: supply chain (cargo deny + cargo audit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny check
        run: cargo deny --locked check
      - name: cargo audit (workspace, gating)
        # Same ignores as deny.toml (reasons there), plus RUSTSEC-2023-0071 (rsa): it is only a stale
        # Cargo.lock entry (ssh-key's optional rsa feature is off; `cargo tree -i rsa --target all` is
        # empty), so it is never compiled. cargo deny walks the real graph and does not flag it.
        run: |
          cargo audit --file Cargo.lock \
            --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071
      - name: cargo audit (desktop app lock)
        # Same unreachable/transitive ignores as the root workspace: RUSTSEC-2026-0387 (crypto-bigint via ssh-key 0.6)
        # and RUSTSEC-2023-0071 (rsa stale entry in lockfile).
        run: |
          cargo audit --file apps/desktop/src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, rust-test, rust-clippy, frontend, tauri-macos, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all code jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) echo "::error::a CI job ended with '$r'"; exit 1;; esac; done
          [ "${{ needs.changes.result }}" = success ] || { echo "::error::change detection failed"; exit 1; }
