name: Feature
description: New feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes: { label: What, description: What should exist when this is done? }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Testable bullet points }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes: { label: Area, options: [core, desktop, extension, ios, cli] }
    validations: { required: true }
  - type: dropdown
    id: agent
    attributes: { label: Suggested agent, options: [edison, opencode, agy, grokbot, human] }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Notes, description: "Files, constraints (see AGENTS.md). No secrets." }
