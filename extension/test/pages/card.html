<!doctype html><html><head><meta charset="utf-8"><title>gitpass test: checkout</title></head><body>
<h1>Checkout</h1>
<form id="pay" action="/pay">
  <input id="num" name="cardnumber" autocomplete="cc-number" inputmode="numeric" placeholder="Card number">
  <input id="name" name="ccname" placeholder="Name on card">
  <select id="mm" name="exp-month"><option value="">MM</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option></select>
  <select id="yy" name="exp-year"><option value="">YYYY</option><option>2026</option><option>2027</option><option>2028</option><option>2029</option></select>
  <input id="cvc" name="cvc" placeholder="CVC" maxlength="4">
  <button>Pay</button>
</form>
<form id="pay2" action="/pay2">
  <input id="n2" placeholder="Card number"><input id="exp2" placeholder="MM / YY"><input id="c2" placeholder="Security code">
</form>
<form id="ship" action="/ship">
  <input id="fn" name="firstName" autocomplete="given-name"><input id="ln" name="lastName" autocomplete="family-name">
  <input id="addr" name="address1" placeholder="Street address"><input id="city" name="city"><input id="zip" name="zip">
  <select id="country" name="country"><option value="">Country</option><option value="TH">Thailand</option><option value="US">United States</option></select>
  <input id="tel" type="tel" name="phone"><input id="mail" type="email" name="email">
</form>
</body></html>
