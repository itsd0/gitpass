name: Release
# Tag push v* -> GitHub Release on itsd0/gitpass (this repo) with installers + updater artifacts + latest.json,
# published as Latest by the `publish` job once both macOS builds succeed (#292).
# Transition: installed apps up to 0.6.7 only check itsd0/gitpass-releases, so `publish` also mirrors the
# installers, updater artifacts and latest.json (URLs rewritten to gitpass-releases) to a release there.
# Requires secret RELEASES_REPO_TOKEN (mirror only): fine-grained PAT, repo itsd0/gitpass-releases only,
# Contents: read & write.
# workflow_dispatch -> same builds, uploaded as workflow artifacts only (no release).
#
# Self-hosted runner policy: the self-hosted Mac (label gitpass-mac) is used ONLY by this workflow, which has
# no pull_request / pull_request_target trigger, and every self-hosted job is guarded so it runs only in
# itsd0/gitpass (never a fork) and only when the owner itsd0 pushed the v* tag or dispatched the run.
# Cost control: macOS builds run on the self-hosted Mac (label gitpass-mac, free). Windows/Linux use hosted
# runners and only run on a manual dispatch with include_windows_linux=true, so a tag release is macOS-only.
# Signing: macOS bundles are signed with the self-signed keychain identity "gitpass Local Signing" (not
# Developer ID, not notarized). The runner LaunchAgent must run in the logged-in user's session with the
# login keychain unlocked (see docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_windows_linux:
        description: "Also build Windows + Linux on hosted runners (uses Actions minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: desktop (${{ matrix.name }})
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 90
    permissions:
      contents: write  # tauri-action creates/updates the draft release on this repo
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: macos-arm64, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin --bundles app,dmg" }
          - { name: macos-x64, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin --bundles app,dmg" }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
      APPLE_SIGNING_IDENTITY: "gitpass Local Signing"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: preflight (rust target + signing identity reachable)
        run: |
          rustup target add ${{ matrix.target }}
          security find-identity -p codesigning | grep -q "gitpass Local Signing" || { echo "::error::signing identity not visible to the runner (keychain locked or wrong session)"; exit 1; }
          f="$RUNNER_TEMP/signtest"; cp /bin/echo "$f"
          codesign --force -s "gitpass Local Signing" "$f" || { echo "::error::codesign failed: unlock the login keychain on the Mac"; exit 1; }
          rm -f "$f"
      - working-directory: apps/desktop
        run: npm ci
      - name: build + publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: gitpass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. macOS builds are signed with a self-signed certificate (not Developer ID, not notarized).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
      - name: clean built app from runner (avoid duplicate Launchpad icons)
        if: always()
        run: |
          LSREGISTER="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
          if [ -d apps/desktop/src-tauri/target ]; then
            find apps/desktop/src-tauri/target -type d -name "*.app" -prune | while IFS= read -r app; do
              if [ -n "$app" ] && [ -d "$app" ]; then
                if [ -x "$LSREGISTER" ]; then
                  "$LSREGISTER" -u "$app" 2>/dev/null || true
                fi
                rm -rf "$app"
              fi
            done
          fi
          touch .metadata_never_index ../.metadata_never_index 2>/dev/null || true

  publish:
    name: publish release (+ mirror to gitpass-releases)
    needs: macos
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - name: download and check assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" -R itsd0/gitpass
          v="${TAG#v}"
          for f in "gitpass_${v}_aarch64.dmg" "gitpass_${v}_x64.dmg" gitpass_aarch64.app.tar.gz gitpass_aarch64.app.tar.gz.sig \
                   gitpass_x64.app.tar.gz gitpass_x64.app.tar.gz.sig latest.json; do
            [ -s "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          jq -e --arg v "$v" '.version == $v and (.platforms | has("darwin-aarch64") and has("darwin-x86_64"))' latest.json
      - name: publish on itsd0/gitpass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" -R itsd0/gitpass --draft=false --prerelease
          else
            gh release edit "$TAG" -R itsd0/gitpass --draft=false --prerelease=false --latest
          fi
      - name: mirror to itsd0/gitpass-releases (updater endpoint of installed apps)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cd dist
          sed -i 's#https://github.com/itsd0/gitpass/releases/download/#https://github.com/itsd0/gitpass-releases/releases/download/#g' latest.json
          flags="--latest"; [ "$PRERELEASE" = true ] && flags="--prerelease"
          if gh release view "$TAG" -R itsd0/gitpass-releases >/dev/null 2>&1; then
            gh release upload "$TAG" -R itsd0/gitpass-releases --clobber ./*
            gh release edit "$TAG" -R itsd0/gitpass-releases --draft=false $flags
          else
            gh release create "$TAG" -R itsd0/gitpass-releases --target main --title "gitpass $TAG" $flags \
              --notes "Mirror for auto-update. Release notes: https://github.com/itsd0/gitpass/releases/tag/$TAG" ./*
          fi

  other-os:
    name: desktop (${{ matrix.name }}, hosted)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0' && github.event_name == 'workflow_dispatch' && inputs.include_windows_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, args: "--bundles appimage,deb" }
          - { name: windows-x64, os: windows-latest, args: "--bundles msi,nsis" }
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}  # empty for the current unencrypted key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - working-directory: apps/desktop
        run: npm ci
      # Manual dispatch never publishes; artifacts only. To add these to a release, upload them by hand.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi*
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe*
          if-no-files-found: error

  cli-host:
    name: cli + native host (macOS arm64)
    if: github.repository == 'itsd0/gitpass' && github.actor == 'itsd0' && github.triggering_actor == 'itsd0'
    runs-on: [self-hosted, macOS, gitpass-mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo build --release --locked -p gitpass-cli -p gitpass-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitpass-cli-host-macos-arm64
          path: |
            target/release/gitpass
            target/release/gitpass-host
